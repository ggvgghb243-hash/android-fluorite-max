name: Build Android APK (Fluorite Max)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Overlay APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/*.apk output_apk/FluoriteMax.apk || cp $(find app/build -name "*.apk" | head -n 1) output_apk/FluoriteMax.apk
          ls -lh output_apk/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluorite-Max-Android-APK
          path: output_apk/*.apk
          if-no-files-found: error
